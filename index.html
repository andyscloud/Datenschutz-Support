<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05061a">
    <title>Andreas Neumann – Datenschutz &amp; Support</title>
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            background: #05061a;
            color: #fff;
            font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Aurora: blurred, slowly drifting color veils */
        .aurora {
            position: fixed;
            inset: -25%;
            filter: blur(70px) saturate(130%);
            z-index: 0;
        }

        .veil {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            opacity: 0.9;
            animation: drift 22s ease-in-out infinite alternate;
        }

        .veil.green  { width: 70vmax; height: 34vmax; left: 5%;  top: 18%; background: radial-gradient(closest-side, #2ef2b5, transparent); transform: rotate(-18deg); }
        .veil.cyan   { width: 60vmax; height: 30vmax; left: 35%; top: 8%;  background: radial-gradient(closest-side, #3fb8ff, transparent); animation-duration: 26s; animation-delay: -6s; }
        .veil.violet { width: 75vmax; height: 40vmax; left: 20%; top: 45%; background: radial-gradient(closest-side, #7b4dff, transparent); animation-duration: 30s; animation-delay: -12s; }
        .veil.pink   { width: 45vmax; height: 26vmax; left: 55%; top: 55%; background: radial-gradient(closest-side, #ff5ca8, transparent); opacity: 0.45; animation-duration: 34s; animation-delay: -3s; }

        @keyframes drift {
            0%   { transform: translate(0, 0) rotate(-12deg) scale(1); }
            50%  { transform: translate(6vmax, -4vmax) rotate(4deg) scale(1.12); }
            100% { transform: translate(-5vmax, 3vmax) rotate(-20deg) scale(0.95); }
        }

        /* Faint stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.5;
            background-image:
                radial-gradient(1px 1px at 12% 22%, #fff, transparent),
                radial-gradient(1px 1px at 78% 14%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 64% 72%, #fff, transparent),
                radial-gradient(1px 1px at 28% 84%, #fff, transparent),
                radial-gradient(1px 1px at 90% 58%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 42% 9%, #fff, transparent),
                radial-gradient(1px 1px at 6% 62%, #fff, transparent),
                radial-gradient(1px 1px at 52% 44%, #fff, transparent);
        }

        /* Glass card */
        main {
            position: relative;
            z-index: 2;
            width: min(480px, calc(100% - 32px));
            padding: 48px 32px 40px;
            text-align: center;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            backdrop-filter: blur(28px) saturate(150%);
        }

        h1 {
            margin: 0 0 34px;
            font-size: clamp(28px, 8.5vw, 44px);
            white-space: nowrap;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 30%, #c9c2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }


        .links {
            display: grid;
            gap: 12px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .links a:hover,
        .links a:focus-visible {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .links svg {
            width: 20px;
            height: 20px;
            flex: none;
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
        }

        @media (prefers-reduced-motion: reduce) {
            .veil { animation: none; }
            .links a { transition: none; }
        }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <div class="veil green"></div>
        <div class="veil cyan"></div>
        <div class="veil violet"></div>
        <div class="veil pink"></div>
    </div>
    <div class="stars" aria-hidden="true"></div>

    <main>
        <h1>Andreas Neumann</h1>

        <nav class="links">
            <a href="datenschutz.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
                Datenschutz
            </a>
            <a href="support.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/>
                    <path d="M12 17h.01"/>
                </svg>
                Hilfe &amp; Support
            </a>
        </nav>

        <footer>© 2026 Andreas Neumann</footer>
    </main>
</body>
</html>
