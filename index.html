<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05061a">
    <title>Andreas Neumann – Datenschutz &amp; Support</title>
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            background: #05061a;
            color: #fff;
            font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Aurora wie in der App: breite Leuchtbänder, die langsam hin und her wandern und atmen */
        .aurora {
            position: fixed;
            inset: 0;
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
        }

        .veil {
            --i: 0;
            position: absolute;
            left: -25vw;
            width: 150vw;
            border-radius: 999px;
            mix-blend-mode: screen;
            opacity: 0.32;
            animation:
                sway   31.4s ease-in-out infinite alternate calc(var(--i) * -17s),
                bob    41.9s ease-in-out infinite alternate calc(var(--i) * -30.7s),
                breathe 18.9s ease-in-out infinite alternate calc(var(--i) * -11.4s);
        }

        .veil.cyan   { --i: 0; top:  6%; height: 190px; margin-top: -95px;  background: #3fb8ff; }
        .veil.green  { --i: 1; top: 18%; height: 240px; margin-top: -120px; background: #2ef2b5; }
        .veil.violet { --i: 2; top: 30%; height: 200px; margin-top: -100px; background: #7b4dff; }
        .veil.pink   { --i: 3; top: 42%; height: 250px; margin-top: -125px; background: #ff5ca8; }

        @keyframes sway    { from { translate: -14vw 0; } to { translate: 14vw 0; } }
        @keyframes bob     { from { transform: translateY(-28px); } to { transform: translateY(28px); } }
        @keyframes breathe { from { opacity: 0.18; } to { opacity: 0.46; } }

        /* Sterne (Position und Funkeln wie in der App, siehe Skript unten) */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .stars i {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0.15;
            animation: twinkle 6.3s ease-in-out infinite alternate;
        }

        @keyframes twinkle { from { opacity: 0.15; } to { opacity: 0.6; } }

        /* Glass card */
        main {
            position: relative;
            z-index: 2;
            width: min(480px, calc(100% - 32px));
            padding: 48px 32px 40px;
            text-align: center;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            backdrop-filter: blur(28px) saturate(150%);
        }

        h1 {
            margin: 0 0 28px;
            font-size: clamp(28px, 8.5vw, 44px);
            white-space: nowrap;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 30%, #c9c2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }


        .avatar {
            display: block;
            width: 160px;
            height: 160px;
            margin: 0 auto 34px;
            border-radius: 50%;
            object-fit: contain;
            padding: 10px 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
        }

        .links {
            display: grid;
            gap: 12px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .links a:hover,
        .links a:focus-visible {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .links svg {
            width: 20px;
            height: 20px;
            flex: none;
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
        }

        footer a { color: rgba(255, 255, 255, 0.6); text-underline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            .veil, .stars i { animation: none; }
            .links a { transition: none; }
        }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <div class="veil green"></div>
        <div class="veil cyan"></div>
        <div class="veil violet"></div>
        <div class="veil pink"></div>
    </div>
    <div class="stars" aria-hidden="true"></div>

    <main>
        <h1>Andreas Neumann</h1>
        <img class="avatar" src="profil.png" width="160" height="160" alt="Foto von Andreas Neumann">

        <nav class="links">
            <a href="datenschutz.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
                Datenschutz
            </a>
            <a href="support.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/>
                    <path d="M12 17h.01"/>
                </svg>
                Hilfe &amp; Support
            </a>
        </nav>

        <footer>© 2026 Andreas Neumann · <a href="index-en.html">English</a></footer>
    </main>
    <script>
        // Gleiche Pseudo-Zufallszahlen wie in der App: feste Sternpositionen, kein Flackern beim Neuladen
        const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        const stars = document.querySelector('.stars');
        for (let d = 0; d < 40; d++) {
            const star = document.createElement('i');
            const size = 1 + rnd(d + 502) * 1.8;
            star.style.cssText = `left:${rnd(d + 500) * 100}%;top:${rnd(d + 501) * 60}%;width:${size}px;height:${size}px;animation-delay:${-4 * d}s`;
            stars.appendChild(star);
        }
    </script>
</body>
</html>
